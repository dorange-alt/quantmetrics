[project]
name = "quantmetrics"
version = "0.1.0"
description = "A minimal numpy-based library for quantitative risk metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
